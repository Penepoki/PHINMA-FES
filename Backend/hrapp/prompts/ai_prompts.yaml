context:
  copus:
    overview: |
      COPUS (Classroom Observation Protocol for Undergraduate STEM) is a tool used to systematically observe and document classroom activities in STEM education.
      It categorizes instructor and student behaviors to provide insights into teaching practices and classroom engagement.
    purpose: |
      The goal of COPUS is to help educators and researchers understand and improve teaching effectiveness by analyzing classroom interactions and instructional methods.
  active_learning:
    overview: |
      Active learning refers to instructional methods that engage students in the learning process directly, often through activities and discussions in class, rather than passively listening to lectures.
      Examples include group work, problem-solving, peer instruction, and hands-on activities.
    relevance_to_copus: |
      COPUS codes can be used to identify and quantify active learning strategies in the classroom.
      Observing the frequency and variety of active learning activities helps educators assess and enhance student engagement and learning outcomes.
  activity_categories:
    student:
      - Listening
      - Individual Thinking
      - Group
      - Answer Question
      - Ask Question
      - Whole Class Discussion
      - Student Presentation
      - Test/Quiz
      - Waiting
      - Other
    professor:
      - Lecture
      - Realtime Writing
      - Moving/Guiding
      - Answer Questions
      - Pose Question
      - Follow-up Question
      - 1-on-1 Discussion
      - Demonstrative
      - Administrative
      - Waiting
      - Other

prompts:
  copus_code_explanation:
    title: "COPUS Code Explanation"
    description: |
      Using the COPUS framework and considering the role of active learning, provide a detailed and accessible explanation of the observed classroom activities.
      Clearly describe the meaning of each COPUS code present, how it reflects classroom behavior, and its significance in the context of STEM education and active learning.
      Avoid jargon and ensure the explanation is understandable to educators and non-experts.
    usage: "Use this prompt to instruct the AI to explain COPUS code blocks in the context of classroom observation and active learning."
    version: 1.1

  feedback_instructions:
    title: "Feedback Instructions"
    description: |
      Based on the COPUS observation data, give constructive and actionable feedback to the instructor.
      Highlight effective teaching practices, especially those that promote active learning, and suggest specific strategies to enhance student engagement and learning.
      Be concise, respectful, and focus on supporting professional growth in STEM education.
    usage: "Use this prompt to instruct the AI to generate feedback for instructors based on COPUS observations, with an emphasis on active learning."
    version: 1.1